# Pipeline Configuration
# Defines core paths, Spark settings, and data layer parameters.
# Note: All paths are relative to the project root directory.

project:
  name: lab3-data-engineering

# Directory containing raw source datasets.
source_datasets_dir: "../Lab3-Assignment/datasets"

# Data lake storage zones (Medallion architecture).
zones:
  landing: "data/landing"
  formatted: "data/formatted"
  exploitation: "data/exploitation"

# Target output format for intermediate and serving layers.
# Supported options: 'parquet' (native) or 'delta' (requires delta-spark dependencies).
output_format: "parquet"

spark:
  app_name: "lab3-data-engineering"
  configs:
    spark.sql.session.timeZone: "UTC"
    spark.sql.shuffle.partitions: "8"

# =============================================================================
# Dataset Ingestion Configuration
# =============================================================================
# Configures source data definitions for Barcelona Open Data sources.
# Properties:
#   format: 'csv' | 'json_array' (multiLine) | 'json_lines' (single object per line)
#   path_glob: Relative path to source data under source_datasets_dir
#   partition_by: Partitioning strategy for the formatted zone
datasets:
  income:
    format: csv
    path_glob: "income/*.csv"
    partition_by: ["year"]
    no_consta_code: 99            # Sentinel value representing 'No consta' (Unknown); filtered during formatting.
  density:
    format: json_array
    path_glob: "density/density_opendata_neighborhood_2.json"
    partition_by: ["year"]
  price:
    format: json_lines
    path_glob: "price_opendata/price_opendata_neighborhood.json"
    partition_by: ["year"]

# =============================================================================
# Feature Engineering & Target Definition
# =============================================================================
# Defines parameters for the housing price-tier classification model.
#
# table: Target table name for the exploitation layer.
# join_keys: Primary keys for integrating upstream datasets.
# target: Dependent variable representing price per square meter terciles.
# feature_columns: Continuous variables for model ingestion.
# categorical_columns: Discrete variables requiring encoding (e.g., OneHotEncoding).
analysis:
  table: "price_tier_by_neighborhood_year"
  join_keys: ["Codi_Barri", "year"]
  target: "price_tier"

  # Exploitation layer build parameters
  year_min: 2013
  year_max: 2017
  tier_source: "PerMeter"         # Source metric converted to target terciles, subsequently dropped.
  tier_classes: ["low", "mid", "high"]
  income_rank_source: "rfd_index" # Source column used to calculate annual percentile rankings.

  # Model training parameters
  model_name: "barcelona_price_tier"
  feature_columns: ["rfd_index", "population", "density_gross", "density_net", "surface"]
  categorical_columns: []
  train_fraction: 0.8

# =============================================================================
# Model Tracking & Registry (MLflow)
# =============================================================================
# tracking_uri: URI for the tracking server. Leave empty to default to local ./mlruns.
#   Note: Production/Registry usage requires a database-backed URI.
mlflow:
  tracking_uri: ""
  experiment: "barcelona_price_tier"
